[project]
name = "icon-mcp"
version = "1.0.0"
description = "MCP Icon server for searching and fetching icons from iconfont.cn"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "gocronx"}
]
keywords = ["mcp", "icon", "server", "iconfont", "svg", "model-context-protocol"]

dependencies = [
    "mcp~=2.0.0",
    "httpx~=0.28.1",
    "aiohttp~=3.14.3",
    "pydantic~=2.13.4",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3.0",
    "pytest-asyncio~=1.0.0",
]

[project.scripts]
icon-mcp = "icon_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icon_mcp"]
